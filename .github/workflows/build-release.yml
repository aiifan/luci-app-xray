name: Build ipk

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/qualcommax/ipq60xx
  SDK_FILE: immortalwrt-sdk-25.12.2-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 7fa94d4aff00906cbbcc9a2fa3f836d2b7f7b37915627e233950ffee6fca4140

jobs:
  build:
    name: Build luci-app-xray ipks (aarch64_cortex-a53)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Download and verify SDK
        run: |
          wget -q "$SDK_URL/$SDK_FILE"
          echo "$SDK_SHA256 *$SDK_FILE" | sha256sum -c
          mkdir sdk
          tar -C sdk --strip-components=1 -I zstd -xf "$SDK_FILE"

      - name: Prepare feeds, golang and packages
        run: |
          # opkg 体系（产出 ipk），匹配现有固件；25.12 默认 USE_APK=y 需显式关闭
          sed -i '/^CONFIG_USE_APK=/d; /^# CONFIG_USE_APK/d' sdk/.config
          echo '# CONFIG_USE_APK is not set' >> sdk/.config
          ./sdk/scripts/feeds update -a
          # Xray-core 26.9.30 要求 go 1.27，golang-package.mk 强制 GOTOOLCHAIN=local，
          # 25.12 官方 feed 的 golang 版本不保证满足，统一替换为 sbwml 27.x（go 1.27.2）
          rm -rf sdk/feeds/packages/lang/golang
          git clone --depth 1 -b 27.x https://github.com/sbwml/packages_lang_golang sdk/feeds/packages/lang/golang
          ./sdk/scripts/feeds install -a
          # 本仓库（core/geodata/status 三包）+ xray 核心提供者 + geodata 数据包
          ln -s "$GITHUB_WORKSPACE" sdk/package/luci-app-xray
          git clone --depth 1 https://github.com/yichya/openwrt-xray sdk/package/openwrt-xray
          rm -rf sdk/package/openwrt-xray/.git
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/small-package /tmp/sp
          git -C /tmp/sp sparse-checkout set v2ray-geodata
          rm -rf sdk/package/v2ray-geodata
          mv /tmp/sp/v2ray-geodata sdk/package/v2ray-geodata
          rm -rf /tmp/sp

      - name: Build packages
        run: |
          cd sdk
          make defconfig
          for p in luci-app-xray luci-app-xray-status luci-app-xray-geodata openwrt-xray v2ray-geoip v2ray-geosite; do
            sed -i "s/^# CONFIG_PACKAGE_${p} is not set/CONFIG_PACKAGE_${p}=y/" .config
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
          done
          make defconfig
          make package/luci-app-xray/core/compile package/luci-app-xray/geodata/compile \
               package/luci-app-xray/status/compile package/openwrt-xray/compile \
               package/v2ray-geodata/compile V=s

      - name: Collect ipks
        run: |
          mkdir -p dist
          find sdk/bin/packages -type f -name "*.ipk" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-ipks
          path: dist/*.ipk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
